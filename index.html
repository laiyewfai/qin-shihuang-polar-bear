  /* Caption lives in HTML, not in the SVG: the illustration is full-bleed
     (preserveAspectRatio slice), so on very wide or very tall windows the
     SVG's own top edge can be cropped. Real text always stays put. */
  .cap { position:fixed; top:0; left:0; right:0; z-index:2; padding:16px 12px 0;
         text-align:center; pointer-events:none; }
  .cap h1 { margin:0; font-size:clamp(19px,2.3vw,31px); font-weight:700;
            letter-spacing:.16em; color:#f2e7c6;
            font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
            text-shadow:0 2px 12px rgba(6,12,24,.75); }
  .cap p { margin:9px 0 0; font-size:clamp(10px,.95vw,13px); letter-spacing:.42em;
           color:#bccbdd; font-weight:400;
           font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
           text-shadow:0 2px 12px rgba(6,12,24,.75); }

  /* Only origin-independent motion is CSS (pure translation, opacity). Every
     rotation uses SMIL animateTransform with explicit centres, so nothing
     shifts when the viewport is resized or zoomed. */

  /* Ground scroll: the decor band is exactly 100u periodic, so a -100u shift
     loops seamlessly. Speed = the bear's own stride speed: one 62.4u stride
     per 1.2s gait cycle -> 100u every 1.9222s. */
  #groundScroll { animation: groundScroll 1.9222s linear infinite; }
  @keyframes groundScroll { from { transform:translateX(0); }
                             to   { transform:translateX(-100px); } }

  .flake { animation: snowfall linear infinite; }
  @keyframes snowfall { from { transform:translate(0,0); }
                         to   { transform:translate(-46px,560px); } }

  .star { animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.3; } 50% { opacity:1; } }

  .aurora { animation: auroraDrift ease-in-out infinite; }
  @keyframes auroraDrift { 0%,100% { transform:translateX(0);    opacity:.85; }
                            50%     { transform:translateX(13px); opacity:1;   } }

  /* Body bob, from the rigid-rod model: the support legs reach |18.34deg| at
     the extremes, so the hip sits L(1-cos 18.34)=3.15u lower then and 0.49u
     high when a leg passes vertical. Four support events per gait cycle, so a
     0.3s loop; the model's hand-over knife-edge is smoothed into a cosine. */
  #bear { animation: bearBob .3s ease-in-out infinite; }
  @keyframes bearBob { 0.0% { transform:translateY(3.15px); } 12.5% { transform:translateY(2.76px); } 25.0% { transform:translateY(1.82px); } 37.5% { transform:translateY(0.88px); } 50.0% { transform:translateY(0.49px); } 62.5% { transform:translateY(0.88px); } 75.0% { transform:translateY(1.82px); } 87.5% { transform:translateY(2.76px); } 100.0% { transform:translateY(3.15px); } }

  @media (prefers-reduced-motion: reduce) {
    #groundScroll, .flake, .star, .aurora, #bear { animation:none !important; }
  }
